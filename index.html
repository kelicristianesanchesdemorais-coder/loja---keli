<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja da Keli - Catálogo de Produtos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 20px 0;
            background-color: #232f3e;
            color: white;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px auto;
            display: block;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card img {
            max-width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
        }
        .card h3 {
            font-size: 18px;
            margin: 10px 0;
        }
        .price {
            color: #27ae60;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn-buy {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Minha Loja Online</h1>
        <p>Encontre os melhores produtos com os melhores preços!</p>
    </header>

    <input type="text" id="searchInput" class="search-box" placeholder="Pesquisar produto..." onkeyup="filterProducts()">

    <div class="products-grid" id="productList">
        <div class="card">
            <img src="https://via.placeholder.com/250x180" alt="Produto 1">
            <h3>Produto Exemplo 1</h3>
            <p class="price">R$ 99,90</p>
            <a href="#" class="btn-buy" target="_blank">Comprar Agora</a>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/250x180" alt="Produto 2">
            <h3>Produto Exemplo 2</h3>
            <p class="price">R$ 149,90</p>
            <a href="#" class="btn-buy" target="_blank">Comprar Agora</a>
        </div>
    </div>

    <script>
        function filterProducts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
